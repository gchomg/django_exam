{% extends 'products/base.html' %}
{% block title %}Удаление товара{% endblock %}
{% block content %}
<div class="card border-danger mt-4" style="max-width:500px;">
    <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Подтверждение удаления</h4>
    </div>
    <div class="card-body">
        <p>Вы уверены, что хотите удалить <strong>{{ object }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Да, удалить</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
